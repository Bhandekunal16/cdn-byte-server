services:
  node-proxy-app:
    build:
      context: .
      dockerfile: dockerfile

    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}

    ports:
      - "8001:8001"
      - "4002:4002"
      - "4003:4003"

    restart: unless-stopped

    volumes:
      - ./logs:/app/logs